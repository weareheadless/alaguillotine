# Nginx configuration for fuckyouelon.net → www.fuckyouelon.net
#
# Setup steps:
#   1. Add an A record for fuckyouelon.net → 216.238.93.99 at your DNS provider
#   2. Copy this file: sudo cp nginx-fuckyouelon.conf /etc/nginx/sites-available/fuckyouelon.net
#   3. Run: sudo certbot --nginx -d fuckyouelon.net -d www.fuckyouelon.net
#   4. Run: sudo nginx -t && sudo systemctl reload nginx

# ─── Redirect bare domain → www (port 80) ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name fuckyouelon.net;
    return 301 https://www.fuckyouelon.net$request_uri;
}

# ─── Redirect bare domain → www (port 443) ─────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fuckyouelon.net;

    ssl_certificate /etc/letsencrypt/live/www.fuckyouelon.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.fuckyouelon.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.fuckyouelon.net$request_uri;
}

# ─── HTTP → HTTPS redirect for www ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.fuckyouelon.net;
    return 301 https://www.fuckyouelon.net$request_uri;
}

# ─── Main site (www, HTTPS only) ───────────────────────────────────────
server {
    server_name www.fuckyouelon.net;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 10m;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/www.fuckyouelon.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.fuckyouelon.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
