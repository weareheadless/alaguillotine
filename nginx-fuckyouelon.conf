# Nginx configuration for fuckyouelon.net
# Copy this file to /etc/nginx/sites-available/fuckyouelon.net
# Then: sudo ln -s /etc/nginx/sites-available/fuckyouelon.net /etc/nginx/sites-enabled/
# Then: sudo certbot --nginx -d fuckyouelon.net -d www.fuckyouelon.net
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name fuckyouelon.net www.fuckyouelon.net;

    # Certbot will fill in SSL config automatically after you run it
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Increase body size for message submissions
    client_max_body_size 10m;
}
