# Nginx configuration for fuckyouelon.net → www.fuckyouelon.net
#
# Setup steps:
#   1. Add an A record for fuckyouelon.net → 216.238.93.99 at your DNS provider
#   2. Copy this file: sudo cp nginx-fuckyouelon.conf /etc/nginx/sites-available/fuckyouelon.net
#   3. Run: sudo certbot --nginx -d fuckyouelon.net -d www.fuckyouelon.net
#   4. Run: sudo nginx -t && sudo systemctl reload nginx

# ─── Redirect bare domain → www (port 80) ──────────────────────────────
server {
    if ($host = fuckyouelon.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name fuckyouelon.net;
    return 301 https://www.fuckyouelon.net$request_uri;


}

# ─── Redirect bare domain → www (port 443) ─────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fuckyouelon.net;
    ssl_certificate /etc/letsencrypt/live/www.fuckyouelon.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.fuckyouelon.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.fuckyouelon.net$request_uri;

}

# ─── HTTP → HTTPS redirect for www ─────────────────────────────────────
server {
    if ($host = www.fuckyouelon.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.fuckyouelon.net;
    return 301 https://www.fuckyouelon.net$request_uri;


}

# ─── Main site (www, HTTPS only) ───────────────────────────────────────
server {
    server_name www.fuckyouelon.net;

    # ─── Pelican blog (static) at /blog/ ─────────────────────────────
    # Serves Madame Guillotine's published posts. The blog builds to a
    # static folder, so nginx just serves it — no proxy, no app server.
    # Redirect /blog (no slash) → /blog/ so it doesn't fall through to the
    # app proxy and 404.
    location = /blog {
        return 301 /blog/;
    }

    location /blog/ {
        alias /SOCIAL/anticapitalist-bot/blog/output/;
        index index.html;
        # Cache static assets; HTML is regenerated on publish.
        location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # ─── Vaporware Vanguard (static game) at /vaporware-vanguard/ ────
    # The satirical billionaire game. Static files served straight from
    # disk — no proxy, no app server.
    location = /vaporware-vanguard {
        return 301 /vaporware-vanguard/;
    }

    location /vaporware-vanguard/ {
        alias /FYE/public/vaporware-vanguard/;
        index index.html;
        location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|html)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long reads for the /admin direct line — she can take a while.
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    client_max_body_size 10m;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/www.fuckyouelon.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.fuckyouelon.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

}
